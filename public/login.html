<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffdf5"><title>Sign in · Tablemate</title>
<script src="/helpers.js"></script><script src="/theme-init.js"></script>
<link rel="stylesheet" href="/tokens.css"><link rel="stylesheet" href="/style.css">
<script src="/prefs.js" defer></script><script src="/login.js" defer></script></head><body>
<header class="masthead"><a class="wordmark" href="/">tablemate<span class="wordmark-dot">.</span></a></header>
<main class="account-page"><section class="entry-panel"><p class="eyebrow">YOUR TABLEMATE ACCOUNT</p>
<h1>Sign in for your history.</h1><p>Guest play always works. An account keeps your nights across devices.</p>
<div id="google-signin" class="google-signin"><div id="google-signin-button" hidden></div>
<button id="google-signin-unavailable" type="button" disabled>Continue with Google</button>
<p id="google-signin-note">Google sign-in is not set up for this table yet.</p></div>
<p id="signin-divider" class="signin-divider"><span>or use email</span></p>
<form id="login-form"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" maxlength="254" required>
<button class="primary" type="submit">Send sign-in link</button></form><p id="login-status" role="status"></p>
<p id="local-login" hidden><a id="local-login-link" href="#">Open one-time local sign-in link</a></p>
</section></main></body></html>
